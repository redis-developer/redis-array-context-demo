[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-array-context-demo"
version = "0.1.0"
description = "Demo showcasing Redis 8.8 Arrays as a context retrieval layer for agents."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "redis>=5.2.0",
    "redisvl>=0.4.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
redis-array-demo = "cli.main:app"

[tool.setuptools]
packages = ["backend", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
